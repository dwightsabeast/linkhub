# release.yml — build + publish a LinkHub release on tag push.
#
# Triggered by tags matching v*. Produces:
#
#   linkhub-linux-amd64.tar.gz
#   linkhub-linux-amd64.tar.gz.sha256
#
# Uploaded to the GitHub Release page that the tag created. The
# install script (install/linkhub-install.sh) fetches from
# /releases/latest/download/linkhub-linux-amd64.tar.gz, which GitHub
# resolves to whatever the most recent release is.
#
# v1 is amd64-only; arm64 is a one-line matrix addition when we want
# it.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  # Required to upload assets onto the auto-created release.
  contents: write

jobs:
  build:
    name: build linux/amd64
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed so `git describe` produces the version
          # stamp the Makefile injects via -ldflags.
          fetch-depth: 0

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # Module cache; speeds up subsequent runs but harmless on
          # first run.
          cache: true

      - name: verify go.mod and go.sum are current
        # Was a bare `go mod tidy`, which silently regenerated a go.sum
        # that had never been committed — so releases built from sums
        # nobody had reviewed, and a fresh clone couldn't build at all.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: make vet

      - name: test
        run: go test -race ./...

      - name: tarball
        # `make tarball` builds both binaries with version stamping
        # baked in, flattens the static layout, and writes the
        # .sha256 sibling. Deterministic enough for "what's in
        # this release" debugging.
        run: make tarball

      - name: show release contents
        # Sanity print so the Action log is self-documenting when
        # something goes sideways months from now.
        run: |
          ls -la dist/
          echo
          echo "tarball contents:"
          tar tzf dist/linkhub-linux-amd64.tar.gz
          echo
          echo "checksum:"
          cat dist/linkhub-linux-amd64.tar.gz.sha256

      - name: publish release (draft with assets)
        # softprops/action-gh-release attaches files to the release
        # the tag implicitly created. We create it as a *draft* so the
        # release isn't visible to consumers until every asset is
        # attached — see the promote step below.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linkhub-linux-amd64.tar.gz
            dist/linkhub-linux-amd64.tar.gz.sha256
          # Don't auto-generate notes; the human who tagged knows
          # what shipped. Empty body is fine for a first release.
          generate_release_notes: false
          # Upload as a draft first. The install/update scripts resolve
          # the version via /releases/latest, which excludes drafts —
          # so the new tag stays invisible until the tarball + checksum
          # are fully uploaded. This closes the race where the release
          # is "Latest" but the asset still 404s mid-upload.
          draft: true
          prerelease: false

      - name: promote release to latest
        # Flip the draft to published now that both assets are attached.
        # Only from here does /releases/latest return this version, and
        # by then the tarball is downloadable. gh is preinstalled on the
        # GitHub-hosted runner.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
