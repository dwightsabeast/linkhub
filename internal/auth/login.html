<!DOCTYPE html>
<!--
  login.html — form-auth sign-in page (AUTH_MODE=form).

  Served by the auth package itself, not from the static dir, so the
  login screen has no dependencies and works before any session exists.
  Styling is inline and self-contained; the palette mirrors the admin's
  light-mode tokens (cream paper, deep-green accent) so the two pages
  feel like one product.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkHub — Sign in</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<style>
  :root {
    --bg:          #F4F0E8;
    --bg-elev:     #FBF8F1;
    --ink:         #14130F;
    --ink-soft:    #4A4740;
    --ink-faint:   #8A8478;
    --rule:        #D8D2C2;
    --accent:      #3D5A4C;
    --accent-ink:  #FBF8F1;
    --danger:      #B23A3A;
    --radius:      14px;
    --radius-sm:   8px;
    --font-body:   "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-display:"Fraunces", "Iowan Old Style", "Palatino", Georgia, serif;
    --shadow-card: 0 1px 0 rgba(20,19,15,0.04), 0 8px 24px -12px rgba(20,19,15,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--bg-elev);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 32px 28px;
  }
  .sub {
    font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.6rem;
    margin: 4px 0 20px;
  }
  label {
    display: block;
    font-size: 0.8rem; font-weight: 500;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(61, 90, 76, 0.12);
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px 14px;
    font: inherit; font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    margin: 0 0 18px;
    padding: 9px 12px;
    font-size: 0.82rem;
    color: var(--danger);
    background: rgba(178, 58, 58, 0.08);
    border: 1px solid rgba(178, 58, 58, 0.28);
    border-radius: var(--radius-sm);
  }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login" autocomplete="off">
    <div class="sub">LinkHub</div>
    <h1>Admin sign-in</h1>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}" />
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username"
           autocapitalize="off" autocorrect="off" spellcheck="false" autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
